<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RADIA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #05070d;
    --panel: rgba(18, 28, 48, 0.72);
    --line: rgba(80, 200, 255, 0.28);
    --cyan: #4fd8ff;
    --gold: #ffc861;
    --text: #e7f3ff;
    --dim: #8aa3bf;
    --ok: #52e3a4;
    --warn: #ffb057;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100vh; padding: 16px 14px calc(24px + env(safe-area-inset-bottom)); background:
    radial-gradient(900px 500px at 50% -10%, rgba(79, 216, 255, 0.18), transparent 60%),
    radial-gradient(600px 400px at 110% 110%, rgba(255, 200, 97, 0.10), transparent 60%), var(--bg); }
  .core { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .orb { width: 58px; height: 58px; border-radius: 50%; flex: none; position: relative;
    background: radial-gradient(circle at 50% 50%, #bff3ff 0 10%, var(--cyan) 22%, rgba(79,216,255,0.15) 58%, transparent 70%);
    box-shadow: 0 0 28px rgba(79, 216, 255, 0.55); animation: pulse 3.2s ease-in-out infinite; }
  .orb::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 1px solid var(--line); border-top-color: var(--cyan); animation: spin 6s linear infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 44px rgba(79, 216, 255, 0.85); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { margin: 0; font-size: 22px; letter-spacing: 0.18em; }
  .sub { color: var(--dim); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 22px; color: var(--cyan); }
  .stat.gold b { color: var(--gold); }
  .stat span { color: var(--dim); font-size: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-bottom: 14px; backdrop-filter: blur(8px); }
  .card h2 { margin: 0 0 8px; font-size: 13px; letter-spacing: 0.12em; color: var(--dim); text-transform: uppercase; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button { font: inherit; color: var(--text); background: rgba(79, 216, 255, 0.10); border: 1px solid var(--line); border-radius: 12px; padding: 12px 8px; cursor: pointer; }
  button:active { transform: scale(0.97); background: rgba(79, 216, 255, 0.22); }
  button.main { grid-column: 1 / -1; background: linear-gradient(90deg, rgba(79,216,255,0.28), rgba(255,200,97,0.22)); font-weight: 600; }
  textarea { width: 100%; min-height: 76px; resize: vertical; font: inherit; color: var(--text); background: rgba(0, 0, 0, 0.35); border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 8px; }
  .order { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid rgba(80, 200, 255, 0.10); }
  .order:first-of-type { border-top: 0; }
  .pill { flex: none; font-size: 11px; padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor; }
  .pill.ok { color: var(--ok); } .pill.run { color: var(--cyan); } .pill.wait { color: var(--warn); } .pill.bad { color: #ff6b7a; }
  .muted { color: var(--dim); font-size: 13px; }
  .note { color: var(--warn); font-size: 13px; margin-bottom: 12px; display: none; }
</style>
</head>
<body>
  <div class="core">
    <div class="orb"></div>
    <div>
      <h1>RADIA</h1>
      <div class="sub" id="at">Conectando…</div>
    </div>
  </div>

  <div class="note" id="note">Abre esta pantalla desde el botón “📱 Abrir RADIA” de Telegram para que los botones funcionen.</div>

  <div class="grid">
    <div class="stat"><b id="open">–</b><span>clientes nuevos</span></div>
    <div class="stat"><b id="sent">–</b><span>escritos</span></div>
    <div class="stat gold"><b id="eur">–</b><span>cobrado mes</span></div>
  </div>

  <div class="card">
    <h2>🛠 Pedir un cambio a Cursor</h2>
    <textarea id="ask" placeholder="Ej: pon el menú más corto"></textarea>
    <div class="btns"><button class="main" data-free>Mandar a Cursor</button></div>
  </div>

  <div class="card">
    <h2>💰 Ganar dinero</h2>
    <div class="btns">
      <button data-cmd="radar">🎯 Buscar clientes</button>
      <button data-cmd="leads">📋 Mis clientes</button>
      <button data-cmd="presupuesto">🧾 Presupuesto</button>
      <button data-cmd="nicho">💡 Ideas Etsy</button>
    </div>
  </div>

  <div class="card">
    <h2>🤖 Encargos de Cursor</h2>
    <div id="orders" class="muted">Sin datos todavía.</div>
  </div>

  <div class="card">
    <h2>📌 Día a día</h2>
    <div class="btns">
      <button data-cmd="estado">📊 Estado</button>
      <button data-cmd="avisos">⏰ Avisos</button>
      <button data-cmd="clima">🌤 Clima</button>
      <button data-cmd="noticias">📰 Noticias</button>
    </div>
  </div>

<script>
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#05070d'); tg.setBackgroundColor('#05070d'); } catch (e) {} }
  var inTelegram = !!(tg && tg.initData);
  if (!inTelegram) document.getElementById('note').style.display = 'block';

  function readState() {
    var m = location.hash.match(/s=([A-Za-z0-9_-]+)/);
    if (!m) return null;
    try {
      var b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      var bytes = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
      return JSON.parse(new TextDecoder().decode(bytes));
    } catch (e) { return null; }
  }

  function pill(o) {
    if (o.s === 'en_radia') return '<span class="pill ok">en RADIA</span>';
    if (o.s === 'fallo' || /ERROR|CANCELLED|EXPIRED/.test(o.r)) return '<span class="pill bad">error</span>';
    if (o.s === 'hecho') return '<span class="pill ok">terminado</span>';
    if (o.s === 'lanzado') return '<span class="pill run">trabajando</span>';
    return '<span class="pill wait">en cola</span>';
  }
  function esc(s) { return String(s || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  var s = readState();
  if (s) {
    document.getElementById('at').textContent = (s.goal || 'Tu asistente') + ' · ' + s.at;
    document.getElementById('open').textContent = s.open;
    document.getElementById('sent').textContent = s.sent;
    document.getElementById('eur').textContent = (s.eur || 0) + ' €';
    if (s.orders && s.orders.length) {
      document.getElementById('orders').innerHTML = s.orders.map(function (o) {
        return '<div class="order">' + pill(o) + '<div>#' + o.n + ' ' + esc(o.t) + '</div></div>';
      }).join('');
    }
  } else {
    document.getElementById('at').textContent = 'Tu asistente';
  }

  function send(text) {
    text = String(text || '').trim();
    if (!text) return;
    if (!inTelegram) { alert('Abre RADIA desde el botón de Telegram.'); return; }
    try { tg.HapticFeedback.impactOccurred('medium'); } catch (e) {}
    tg.sendData(text.slice(0, 600));
  }

  document.querySelectorAll('[data-cmd]').forEach(function (b) {
    b.addEventListener('click', function () { send(b.getAttribute('data-cmd')); });
  });
  document.querySelector('[data-free]').addEventListener('click', function () {
    send(document.getElementById('ask').value);
  });
</script>
</body>
</html>
